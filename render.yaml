services:
  - type: web
    name: corvo-procurement
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: corvo-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: LLM_API_KEY
        sync: false
      - key: PORT
        value: "8000"

databases:
  - name: corvo-postgres
    databaseName: corvo_db
    user: corvo
    plan: free
